[project]
name = "fusion-cad-ai"
version = "2.0.0"
description = "Parametric AI-CAD environment: Cursor to MCP to Autodesk Fusion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.1.1",
    "pydantic>=2.6,<3",
]

[project.scripts]
fusion-cad-ai = "fusion_cad_ai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pillow>=10.0.0",
]
verify = [
    "build123d==0.11.1",
    "augura==0.1.7",
    "trimesh==5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fusion_cad_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m \"not fusion and not verify\""
markers = [
    "fusion: needs a running Fusion with the official MCP on 127.0.0.1:27182",
    "verify: needs the optional verify dependency group",
    "slow: long-running",
]

[tool.uv]
package = true
